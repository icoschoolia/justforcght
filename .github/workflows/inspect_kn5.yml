name: Inspect MCL40 KN5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and inspect KN5
        run: python3 tools/inspect_kn5.py

      - name: Commit report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kn5_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add KN5 inspection report"
          git push
